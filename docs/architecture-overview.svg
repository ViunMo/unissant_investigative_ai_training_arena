<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#335a92"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#b8860b"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #143a7a; }
      .sub { font-size: 13px; fill: #4a5a73; }
      .layer { fill: #f4f7fc; stroke: #143a7a; stroke-width: 1.5; rx: 12; }
      .layerTitle { font-size: 15px; font-weight: 700; fill: #143a7a; }
      .layerSub { font-size: 11.5px; fill: #4a5a73; }
      .box { fill: #ffffff; stroke: #335a92; stroke-width: 1.2; rx: 8; }
      .t { font-size: 13px; font-weight: 700; fill: #0e2246; }
      .l { font-size: 12px; fill: #334155; }
      .ext { fill: #fff8e6; stroke: #b8860b; stroke-width: 1.4; rx: 8; }
      .et { font-size: 13px; font-weight: 700; fill: #6b4f00; }
      .store { fill: #eef2f7; stroke: #6b7f9f; stroke-width: 1.2; rx: 8; }
      .edge { stroke: #335a92; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edgeGold { stroke: #b8860b; stroke-width: 1.6; fill: none; marker-end: url(#arrowGold); }
      .edgeLabel { fill: #4a5a73; font-size: 11px; }
      .note { fill: #4a5a73; font-size: 11.5px; }
      .sm { rx: 3; }
    </style>
  </defs>

  <rect width="1440" height="880" fill="#ffffff"/>
  <text x="30" y="40" class="title">Investigative AI Training Arena · architecture overview</text>
  <text x="30" y="62" class="sub">Investigators interview simulated subjects while competing AI assistants coach them; assistants and subjects are compared in blinded bake-offs.</text>

  <!-- Users -->
  <rect x="30" y="360" width="180" height="90" class="box"/>
  <circle cx="66" cy="388" r="11" fill="#143a7a"/>
  <path d="M48 420c2-15 9-20 18-20s16 5 18 20" fill="#143a7a"/>
  <text x="90" y="384" class="t">Investigator</text>
  <text x="90" y="402" class="t">Trainer</text>
  <text x="44" y="438" class="l">browser, signs in once</text>

  <!-- Frontend layer -->
  <rect x="250" y="96" width="320" height="694" class="layer"/>
  <text x="268" y="124" class="layerTitle">React 19 + Vite frontend :5173</text>
  <text x="268" y="142" class="layerSub">Unissant typeface and gold accent, d3-force graphs</text>

  <rect x="270" y="160" width="280" height="58" class="box"/>
  <text x="282" y="180" class="t">Login page</text>
  <text x="282" y="197" class="l">sign in or create account</text>
  <text x="282" y="212" class="l">bearer token in localStorage</text>

  <rect x="270" y="230" width="280" height="74" class="box"/>
  <text x="282" y="250" class="t">Overview</text>
  <text x="282" y="267" class="l">KPIs and knowledge graphs:</text>
  <text x="282" y="282" class="l">concepts, loops, case, session,</text>
  <text x="282" y="297" class="l">across sessions (Neo4j)</text>

  <rect x="270" y="316" width="280" height="74" class="box"/>
  <text x="282" y="336" class="t">Practice</text>
  <text x="282" y="353" class="l">chat with avatars and typing dots</text>
  <text x="282" y="368" class="l">live coaching, released records,</text>
  <text x="282" y="383" class="l">lock a finding, debrief</text>

  <rect x="270" y="402" width="280" height="58" class="box"/>
  <text x="282" y="422" class="t">Sessions</text>
  <text x="282" y="439" class="l">history and questioning score</text>
  <text x="282" y="454" class="l">+20% vs own baseline (L4)</text>

  <rect x="270" y="472" width="280" height="74" class="box"/>
  <text x="282" y="492" class="t">Bake-off</text>
  <text x="282" y="509" class="l">candidate chips, live feed</text>
  <text x="282" y="524" class="l">stop / clear / delete runs</text>
  <text x="282" y="539" class="l">leaderboards, gates, CIs</text>

  <rect x="270" y="558" width="280" height="44" class="box"/>
  <text x="282" y="578" class="t">Scenarios</text>
  <text x="282" y="594" class="l">public case packets only</text>

  <text x="270" y="640" class="note">api.js: /api proxy with Bearer token;</text>
  <text x="270" y="656" class="note">a 401 returns to the login page</text>

  <!-- Backend layer -->
  <rect x="650" y="96" width="540" height="694" class="layer"/>
  <text x="668" y="124" class="layerTitle">FastAPI backend :8000</text>
  <text x="668" y="142" class="layerSub">Python 3.13, LangChain deepagents, pydantic-settings (.env wins over OS env)</text>

  <rect x="670" y="160" width="500" height="56" class="box"/>
  <text x="682" y="180" class="t">auth.py + api/routes.py</text>
  <text x="682" y="197" class="l">PBKDF2 users, HMAC bearer tokens, 12 h expiry</text>
  <text x="682" y="211" class="l">hidden-until-lock views; 401 except /health, /auth</text>

  <rect x="670" y="228" width="240" height="72" class="box"/>
  <text x="682" y="248" class="t">L2 Interview loop</text>
  <text x="682" y="265" class="l">question, subject answer,</text>
  <text x="682" y="280" class="l">coaching, evidence release,</text>
  <text x="682" y="295" class="l">finding locked, scored</text>

  <rect x="930" y="228" width="240" height="72" class="box"/>
  <text x="942" y="248" class="t">L3 Bake-off loop</text>
  <text x="942" y="265" class="l">freeze, replay, interactive</text>
  <text x="942" y="280" class="l">trials on a thread pool</text>
  <text x="942" y="295" class="l">stop at the next model step</text>

  <rect x="670" y="312" width="500" height="108" class="box"/>
  <text x="682" y="332" class="t">Agents (candidates.py: model + prompt + tools + policy)</text>
  <text x="682" y="349" class="l">deepagents assistant with three read-only lookup tools</text>
  <text x="682" y="364" class="l">deepagents subject: private packet, reports a tactic per turn</text>
  <text x="682" y="379" class="l">mock rule baselines; L0 validation loop; L1 rubric loop</text>
  <text x="682" y="394" class="l">HarnessProfile: no filesystem, shell or subagent tools</text>
  <text x="682" y="409" class="l">AssistantContext is the isolation boundary</text>

  <rect x="670" y="432" width="240" height="72" class="box"/>
  <text x="682" y="452" class="t">Scenario engine</text>
  <text x="682" y="469" class="l">3 families x 2 variants</text>
  <text x="682" y="484" class="l">public, private, evaluator</text>
  <text x="682" y="499" class="l">packets; scripted releases</text>

  <rect x="930" y="432" width="240" height="72" class="box"/>
  <text x="942" y="452" class="t">Independent scorer</text>
  <text x="942" y="469" class="l">debrief, evasion P / R,</text>
  <text x="942" y="484" class="l">isolation and 5% FP gates,</text>
  <text x="942" y="499" class="l">bootstrap CIs, progress</text>

  <rect x="670" y="516" width="500" height="88" class="box"/>
  <text x="682" y="536" class="t">llm.py model layer + cache.py</text>
  <text x="682" y="553" class="l">vendor inferred from the model id: gpt-*, claude-*, gemini-*</text>
  <text x="682" y="568" class="l">effort maps to reasoning_effort or adaptive thinking</text>
  <text x="682" y="583" class="l">one request-rate limiter per vendor (Gemini free: 14/min)</text>
  <text x="682" y="598" class="l">SQLite response cache keyed on the conversation; hits cost 0</text>

  <rect x="670" y="616" width="240" height="72" class="store"/>
  <text x="682" y="636" class="t">store.py</text>
  <text x="682" y="653" class="l">JSON snapshots on disk:</text>
  <text x="682" y="668" class="l">sessions, bake-offs, users,</text>
  <text x="682" y="683" class="l">llm_cache.sqlite, secret.key</text>

  <rect x="930" y="616" width="240" height="72" class="store"/>
  <text x="942" y="636" class="t">graph.py (optional)</text>
  <text x="942" y="653" class="l">mirrors locked sessions to</text>
  <text x="942" y="668" class="l">Neo4j in the background;</text>
  <text x="942" y="683" class="l">Cypher insights, rebuild</text>

  <text x="670" y="716" class="note">Private packets and scoring keys never leave the backend</text>
  <text x="670" y="732" class="note">until a finding is locked; every assistant input is logged</text>
  <text x="670" y="748" class="note">and scanned for evaluator-only canaries.</text>

  <!-- External services -->
  <text x="1230" y="420" class="note">keys in backend/.env</text>
  <text x="1230" y="435" class="note">(gitignored)</text>

  <rect x="1230" y="446" width="180" height="50" class="ext"/>
  <text x="1242" y="466" class="et">OpenAI</text>
  <text x="1242" y="484" class="l">gpt-6-luna</text>

  <rect x="1230" y="508" width="180" height="50" class="ext"/>
  <text x="1242" y="528" class="et">Anthropic</text>
  <text x="1242" y="546" class="l">claude-haiku-5-5</text>

  <rect x="1230" y="570" width="180" height="50" class="ext"/>
  <text x="1242" y="590" class="et">Google Gemini</text>
  <text x="1242" y="608" class="l">gemini-3.5-flash-lite</text>

  <text x="1230" y="640" class="note">or any OpenAI-compatible</text>
  <text x="1230" y="655" class="note">gateway (e.g. local Ollama)</text>

  <rect x="1230" y="676" width="180" height="50" class="ext"/>
  <text x="1242" y="696" class="et">Neo4j Aura</text>
  <text x="1242" y="714" class="l">cross-session graph</text>

  <!-- Edges -->
  <path d="M210 405 L270 405" class="edge"/>
  <path d="M550 430 L650 430" class="edge"/>
  <text x="556" y="420" class="edgeLabel">/api, Bearer token</text>
  <path d="M1170 560 L1230 471" class="edgeGold"/>
  <path d="M1170 566 L1230 533" class="edgeGold"/>
  <path d="M1170 572 L1230 595" class="edgeGold"/>
  <path d="M1170 652 L1230 701" class="edgeGold"/>
  <text x="1186" y="652" class="edgeLabel">bolt</text>

  <!-- Legend -->
  <rect x="30" y="820" width="14" height="14" class="box sm"/>
  <text x="52" y="832" class="l">application component</text>
  <rect x="220" y="820" width="14" height="14" class="store sm"/>
  <text x="242" y="832" class="l">persistence</text>
  <rect x="340" y="820" width="14" height="14" class="ext sm"/>
  <text x="362" y="832" class="l">external service (credentials in .env)</text>
  <text x="30" y="862" class="note">Loops: L0 validation (parse, validate, re-prompt) · L1 rubric (grader, revise) · L2 interview · L3 bake-off · L4 investigator improvement. Mermaid versions of every flow: architecture.md.</text>
</svg>
