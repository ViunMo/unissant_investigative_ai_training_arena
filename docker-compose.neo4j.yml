# Optional Neo4j for the cross-session evidence graph:  docker compose -f docker-compose.neo4j.yml up -d
# Then in backend/.env:  ARENA_NEO4J_URI=bolt://localhost:7687  ARENA_NEO4J_PASSWORD=arena-neo4j
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: arena-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (the app connects here)
    environment:
      NEO4J_AUTH: neo4j/arena-neo4j
    volumes:
      - arena-neo4j-data:/data
volumes:
  arena-neo4j-data:
